html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShikhoAI</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081329;
  color: white;
}
header {
  padding: 22px;
  text-align: center;
  background: #122750;
}
header h1 {
  color: #66a5ff;
  font-size: 30px;
}
main {
  padding: 22px;
  max-width: 600px;
  margin: auto;
}
.hero {
  text-align: center;
  padding: 35px 10px;
}
.hero h2 {
  font-size: 27px;
}
.hero p {
  color: #b9c8e4;
}
.card {
  background: #14264a;
  padding: 20px;
  border-radius: 15px;
  margin: 15px 0;
}
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #347cff;
  color: white;
  font-size: 16px;
  margin-top: 12px;
}
input {
  width: 100%;
  padding: 13px;
  border-radius: 9px;
  border: none;
  margin-top: 10px;
}
#result {
  color: #91c5ff;
  line-height: 1.7;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<header>
  <h1>ShikhoAI</h1>
  <p>Learn Smart • Learn Easy</p>
</header>

<main>
  <section class="hero">
    <h2>স্বাগতম ShikhoAI-তে!</h2>
    <p>AI-এর সাহায্যে শেখো নিজের ভাষায়।</p>
  </section>

  <div class="card">
    <h3>📚 AI শিক্ষক</h3>
    <p>তোমার প্রশ্ন লিখে শেখা শুরু করো।</p>
    <input id="question"
      placeholder="তোমার প্রশ্ন লেখো...">
    <button onclick="askQuestion()">
      প্রশ্ন জমা দাও
    </button>
    <p id="result"></p>
  </div>

  <div class="card">
    <h3>📝 Quiz Center</h3>
    <p>প্রতিদিন নতুন কিছু শেখো।</p>
    <button onclick="quiz()">
      Start Quiz
    </button>
    <p id="quizResult"></p>
  </div>

</main>

<script>
function askQuestion() {
  let q = document.getElementById("question").value;

  if (q.trim() === "") {
    alert("প্রথমে প্রশ্ন লেখো!");
  } else {
    document.getElementById("result").innerText =
      "তোমার প্রশ্ন: " + q +
      "\nAI শিক্ষক ফিচার শিগগিরই যুক্ত হবে!";
  }
}

function quiz() {
  document.getElementById("quizResult").innerText =
    "Quiz Center শিগগিরই চালু হবে!";
}
</script>

</body>
</html>
